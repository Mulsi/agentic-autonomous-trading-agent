# Postgres 16 for slice 1 (SLICE_1_PLAN D2, D11). `make db-up` starts it and
# applies the migrations. No other services: no Redis in slice 1.
#
# The credentials are fixed local-development values, published on loopback
# only. They are not a secret; logs still scrub any DATABASE_URL password.
# `.env.example` and the Makefile carry the same URL.
#
# No variable interpolation and no env_file, so a repo-root .env never reaches
# the container. The Makefile also passes --env-file /dev/null.
services:
  postgres:
    # Pinned to the multi-platform image index digest, so every checkout runs
    # the same bytes. progress.md says how to move it to a newer 16.x release.
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    command: postgres -c timezone=UTC -c log_timezone=UTC
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: trader
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket, so the temporary server that initdb runs does not
      # count as ready.
      test: pg_isready -h 127.0.0.1 -U trader -d trader
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
